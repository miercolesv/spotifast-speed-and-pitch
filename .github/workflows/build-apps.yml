# Builds every download the original Spotifast release has, on every push to
# the speed-and-pitch branch or on demand from the Actions tab:
#
#   macOS    universal DMG (Apple Silicon and Intel), drag-to-Applications
#   Windows  x64 and arm64: portable zip and Windows Installer package (.msi)
#   Linux    x86_64 and aarch64: tar.gz, AppImage, .deb, .rpm; Flatpak (x86_64)
#   Source   tarball, and checksums.txt for everything
#
# The build steps follow the original's .github/workflows/release.yml. What
# needs the maintainer's keys is left out: Apple signing and notarization,
# Windows signing (native-packages skips it while the Azure settings are
# unset), the update signature (checksums.txt.sig), and publishing to the AUR
# and Homebrew. Once the builds succeed, they replace the fork's "latest-build"
# release together. The Flatpak is optional there, as in the original.
name: Build apps

on:
  push:
    branches: [speed-and-pitch]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a build still running.
concurrency:
  group: build-apps
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # The release files are named after the version in Cargo.toml, as the
      # original names them after its tag (v1.2.3).
      - id: version
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CMAKE_GENERATOR: Ninja
      TAG: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg-triplet: x64-windows-static
            msvc-arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            vcpkg-triplet: arm64-windows-static
            msvc-arch: arm64
    steps:
      - uses: actions/checkout@v7
      # The version rust-toolchain.toml pins.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      # libprojectM (MilkDrop) reads OpenGL through GLEW on Windows, built
      # against vcpkg's static-runtime triplet like the rest of the app.
      - name: GLEW for libprojectM
        if: runner.os == 'Windows'
        run: vcpkg install glew:${{ matrix.vcpkg-triplet }}
      # Ninja inside the MSVC environment, for the architecture the runner
      # actually is (the action defaults to x64).
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # Keeps compiled dependencies between runs, so later builds are faster.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Windows rows hand their binary to the windows job, which packages
      # both architectures on x64, as the original does.
      - name: Hand the Windows binary on
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/spotifast.exe
          if-no-files-found: error

      - name: Package
        if: runner.os == 'Linux'
        run: |
          name="spotifast-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/spotifast" README.md LICENSE "dist/$name/"
          cp packaging/spotifast-portable.txt "dist/$name/"
          # Desktop integration for package builds and hand-installs.
          cp --parents packaging/applications/spotifast.desktop packaging/icons/spotifast.svg "dist/$name/"
          cp --parents contrib/omarchy/spotifast.json.tpl contrib/omarchy/spotifast-theme "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"

      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux'
        with:
          ruby-version: '4.0'
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libarchive-tools squashfs-tools zsync
          gem install native-packages --version 0.11.0 --no-document
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) id=appimage-amd64 ;;
            aarch64-unknown-linux-gnu) id=appimage-arm64 ;;
          esac
          native-packages build --version "${TAG#v}" --target "$id" --defer-recipes \
            --output "$RUNNER_TEMP/appimage"
          cp "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage \
            "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage.zsync dist/

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  # The portable zip and the Windows Installer package for both
  # architectures, on x64 as in the original: WiX builds the arm64 package
  # there, and its custom actions cross-compile for arm64. Unsigned.
  windows:
    name: windows (${{ matrix.target }})
    needs: [version, build]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            package-target: windows-amd64
            msvc-arch: x64
          - target: aarch64-pc-windows-msvc
            package-target: windows-arm64
            msvc-arch: amd64_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native-packages
        run: gem install native-packages --version 0.11.0 --no-document
      - name: Package
        shell: bash
        run: |
          name="spotifast-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/spotifast.exe" "dist/$name/"
          cp README.md LICENSE packaging/spotifast-portable.txt "dist/$name/"
          cd dist
          7z a "$name.zip" "$name"
      # build-msi.py compiles the installer's custom actions with the MSVC
      # tools for the package's architecture.
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - name: Windows Installer package
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          $version = $env:TAG.TrimStart("v")
          $payload = "dist\msi-input-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $files = "target\${{ matrix.target }}\release\spotifast.exe", "README.md", "LICENSE", "packaging\windows\spotifast-installer.txt"
          Copy-Item $files $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version $version --target ${{ matrix.package-target }} --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\${{ matrix.package-target }}\msi\*.msi" dist\
      # Replaces the binary the build job handed over with the packages.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          overwrite: true
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS universal app
    needs: version
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/spotifast \
            target/x86_64-apple-darwin/release/spotifast \
            -output universal/spotifast
      - name: App bundle
        run: bash packaging/macos/bundle.sh universal/spotifast dist/Spotifast.app "${TAG#v}"
      - name: Disk image
        run: |
          # dmgbuild lays out the Finder window itself (no Finder or screen
          # needed): the app on the left, an arrow, Applications on the right.
          pipx install 'dmgbuild>=1.6,<2'
          cat > dist/dmg-settings.py <<'EOF'
          app = defines["app"]
          files = [app]
          symlinks = {"Applications": "/Applications"}
          icon = app + "/Contents/Resources/spotifast.icns"
          format = "UDZO"
          background = "builtin-arrow"
          window_rect = ((200, 120), (640, 300))
          default_view = "icon-view"
          show_status_bar = False
          show_tab_view = False
          show_toolbar = False
          show_pathbar = False
          show_sidebar = False
          icon_size = 128
          text_size = 13
          icon_locations = {"Spotifast.app": (140, 130), "Applications": (500, 130)}
          EOF
          dmg="dist/spotifast-${TAG}-macos-universal.dmg"
          # hdiutil on GitHub's Macs sometimes fails with "Resource busy";
          # a retry a few seconds later goes through.
          for attempt in 1 2 3 4 5; do
            dmgbuild -s dist/dmg-settings.py -D app=dist/Spotifast.app Spotifast "$dmg" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            rm -f "$dmg"
            sleep 10
          done
          hdiutil verify "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # Everything native-packages.yaml lists under assets, as the one artifact
  # the packaging workflow reads: the two Linux archives, the source archive
  # and the macOS DMG. Its build takes the checksum of each for the Arch and
  # Homebrew recipes it writes beside the packages, so all four must be there.
  linux-inputs:
    name: Linux package inputs
    needs: [version, build, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-unknown-linux-gnu'
          path: downloaded
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: macos-universal
          path: downloaded
      - run: |
          mkdir dist
          cp downloaded/*-unknown-linux-gnu.tar.gz downloaded/*.dmg dist/
          git archive --format=tar.gz --prefix="spotifast-${TAG}/" \
            -o "dist/spotifast-${TAG}-source.tar.gz" HEAD
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-inputs
          path: |
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error

  # .deb and .rpm for both architectures, through the same reusable workflow
  # and version the original uses. Nothing is published from here.
  linux-packages:
    name: Linux packages
    needs: [version, linux-inputs]
    # Its jobs ask for write access, and a run can't start unless the caller
    # grants it, as the original's packaging workflow does. With publish off
    # it writes nothing.
    permissions:
      contents: write
    uses: crmne/native-packages/.github/workflows/package.yml@25a4214d2f203357c84b069f39de7c17c0be6253 # v0.11.0
    with:
      targets: linux-amd64,linux-arm64
      version: ${{ needs.version.outputs.tag }}
      source-artifact: linux-inputs
      source-directory: dist
      publish: false

  # The x86_64 build packaged as a Flatpak bundle, as in the original.
  flatpak:
    name: Flatpak bundle
    needs: [version, build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: Unpack the Linux build
        run: |
          tar xzf "dist/spotifast-${TAG}-x86_64-unknown-linux-gnu.tar.gz" -C packaging/flatpak "spotifast-${TAG}-x86_64-unknown-linux-gnu"
          mv "packaging/flatpak/spotifast-${TAG}-x86_64-unknown-linux-gnu" packaging/flatpak/built
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/rocks.spotifast.Spotifast.bundle.yml
          bundle: spotifast-${{ needs.version.outputs.tag }}-x86_64.flatpak
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error

  publish:
    name: Publish release
    # The Flatpak is welcome but not required, as in the original.
    needs: [version, build, windows, macos, linux-packages, flatpak]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success'
      && needs.macos.result == 'success' && needs.linux-packages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # Publishing a release needs write access to the fork.
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: downloaded
      - name: Release files and checksums
        run: |
          mkdir release
          # Every download, wherever its artifact kept it, once each.
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \
            -o -name '*.msi' -o -name '*.AppImage' -o -name '*.AppImage.zsync' -o -name '*.dmg' \
            -o -name '*.flatpak' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp --update=none {} release/ \;
          # The source archive came with the Linux package inputs.
          test -f "release/spotifast-${TAG}-source.tar.gz"
          cd release
          sha256sum -- * > checksums.txt
          ls -l
      - name: Replace the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Spotifast ${TAG} with speed and pitch controls, built from ${GITHUB_SHA::7}.

          These builds are not signed, so each system asks once before opening them:

          - **macOS:** open the DMG and drag Spotifast to Applications, then run \`xattr -dr com.apple.quarantine /Applications/Spotifast.app\` once.
          - **Windows:** install with the \`.msi\`, or unzip and run \`spotifast.exe\`. If Windows says it protected your PC, choose More info, then Run anyway.
          - **Linux:** the downloads need Ubuntu 24.04 or a distribution at least as recent.

          Turn off update checks in Settings: an update installs the official release, which has no speed and pitch controls.
          EOF
          # One release, always the newest build: drop the old one and its tag.
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build release/* \
            --target "$GITHUB_SHA" \
            --title "Spotifast ${TAG} with speed and pitch (latest build)" \
            --notes-file notes.md \
            --latest
